name: Build OpenClaw Upstream Sandbox Image

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      force_rebuild:
        description: Rebuild even when source, components and security refresh are unchanged
        default: false
        type: boolean
  pull_request:
    paths:
      - 'openclaw-builder/**'
      - 'scripts/*openclaw*'
      - 'scripts/trivy-image-gate.sh'
      - 'scripts/evaluate-trivy-policy.py'
      - 'scripts/test-evaluate-trivy-policy.py'
      - 'scripts/publish-tested-image.py'
      - 'scripts/test-publish-tested-image.py'
      - '.github/workflows/openclaw-upstream-docker.yml'

permissions:
  contents: read

concurrency:
  group: build-openclaw-sandbox-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: read
    outputs:
      skip: ${{ steps.inputs.outputs.skip }}
      upstream_sha: ${{ steps.inputs.outputs.upstream_sha }}
      image_tag: ${{ steps.inputs.outputs.image_tag }}
      build_args: ${{ steps.inputs.outputs.build_args }}
      recipe_digest: ${{ steps.inputs.outputs.recipe_digest }}
      created: ${{ steps.inputs.outputs.created }}
      repository: ${{ steps.inputs.outputs.repository }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@v4
      - name: Validate registry freshness, policy and publication contracts
        run: |
          python3 scripts/test-resolve-openclaw-inputs.py
          bash scripts/test-apply-openclaw-runtime-hardening.sh
          python3 scripts/test-evaluate-trivy-policy.py
          python3 scripts/test-publish-tested-image.py
      - name: Resolve immutable sources and security refresh
        id: inputs
        env:
          GITHUB_TOKEN: ${{ github.token }}
          OWNER: ${{ github.repository_owner }}
          FORCE_REBUILD: ${{ github.event_name == 'pull_request' || inputs.force_rebuild }}
        run: |
          set -euo pipefail
          owner="${OWNER,,}"
          [[ "$owner" =~ ^[a-z0-9][a-z0-9-]*$ ]]
          repository="ghcr.io/$owner/openclaw-sandbox"
          args=()
          if [[ "$FORCE_REBUILD" == true ]]; then args+=(--force); fi
          python3 scripts/resolve-openclaw-inputs.py --repository "$repository" "${args[@]}" \
            --output "$RUNNER_TEMP/openclaw-inputs.json" --github-output "$GITHUB_OUTPUT"
          echo "repository=$repository" >> "$GITHUB_OUTPUT"
      - name: Save resolved build inputs
        uses: actions/upload-artifact@v7
        with:
          name: openclaw-inputs-${{ github.run_attempt }}
          path: ${{ runner.temp }}/openclaw-inputs.json
          if-no-files-found: error
          retention-days: 7

  verify:
    needs: prepare
    if: needs.prepare.outputs.skip == 'false'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Checkout the resolved upstream commit
        uses: actions/checkout@v7
        with:
          repository: openclaw/openclaw
          ref: ${{ needs.prepare.outputs.upstream_sha }}
          path: openclaw-src
          persist-credentials: false
      - name: Apply reviewed runtime hardening
        env:
          UPSTREAM_SHA: ${{ needs.prepare.outputs.upstream_sha }}
        run: |
          test "$(git -C openclaw-src rev-parse HEAD)" = "$UPSTREAM_SHA"
          bash scripts/apply-openclaw-runtime-hardening.sh openclaw-src
      - uses: docker/setup-buildx-action@v4
      - name: Build the native candidate once
        id: build
        uses: docker/build-push-action@v7
        with:
          context: ./openclaw-src
          platforms: linux/amd64
          build-args: ${{ needs.prepare.outputs.build_args }}
          load: true
          provenance: false
          tags: release-factory-test:openclaw-amd64
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            io.release-factory.upstream.revision=${{ needs.prepare.outputs.upstream_sha }}
            io.release-factory.recipe=${{ needs.prepare.outputs.recipe_digest }}
            io.release-factory.build.created=${{ needs.prepare.outputs.created }}
          cache-from: type=gha,scope=openclaw-amd64
          cache-to: type=gha,mode=min,scope=openclaw-amd64
      - name: Verify gateway authentication and isolated sandbox lifecycle
        env:
          IMAGE: ${{ steps.build.outputs.imageid }}
        run: python3 scripts/smoke-openclaw.py "$IMAGE"
      - name: Scan the tested runtime
        env:
          IMAGE: ${{ steps.build.outputs.imageid }}
        run: |
          bash scripts/trivy-image-gate.sh --image "$IMAGE" \
            --policy openclaw-builder/configs/trivy-policy.json --profile sandbox \
            --output "$RUNNER_TEMP/openclaw.trivy.json"
      - name: Save security evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: openclaw-scan-${{ github.run_attempt }}
          path: ${{ runner.temp }}/openclaw.trivy.json
          retention-days: 7
      - name: Log in for release publication
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish the verified image without rebuilding
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          IMAGE: ${{ steps.build.outputs.imageid }}
          REPOSITORY: ${{ needs.prepare.outputs.repository }}
          IMAGE_TAG: ${{ needs.prepare.outputs.image_tag }}
        run: |
          python3 scripts/publish-tested-image.py stage --image "$IMAGE" --image-id "$IMAGE" \
            --variant openclaw --platform linux/amd64 --repository "$REPOSITORY" \
            --revision "$GITHUB_SHA" --run-id "$GITHUB_RUN_ID" --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --receipt "$RUNNER_TEMP/tested-image/receipt.json"
          python3 scripts/publish-tested-image.py publish --directory "$RUNNER_TEMP/tested-image" \
            --variant openclaw --repository "$REPOSITORY" --platforms linux/amd64 \
            --revision "$GITHUB_SHA" --run-id "$GITHUB_RUN_ID" --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --image-tag "$IMAGE_TAG" --latest-tag latest

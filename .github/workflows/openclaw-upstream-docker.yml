name: Build OpenClaw Upstream Sandbox Image

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

concurrency:
  group: build-and-push-openclaw-sandbox-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_REPO: openclaw-sandbox
  TEST_IMAGE: openclaw-sandbox:ci-test
  OPENCLAW_NODE_BOOKWORM_IMAGE: docker.io/library/node:24-bookworm@sha256:5711a0d445a1af54af9589066c646df387d1831a608226f4cd694fc59e745059
  OPENCLAW_NODE_BOOKWORM_SLIM_IMAGE: docker.io/library/node:24-bookworm-slim@sha256:6f7b03f7c2c8e2e784dcf9295400527b9b1270fd37b7e9a7285cf83b6951452d
  OPENCLAW_NODE_BOOKWORM_SLIM_DIGEST: sha256:6f7b03f7c2c8e2e784dcf9295400527b9b1270fd37b7e9a7285cf83b6951452d
  OPENCLAW_NPM_VERSION: "11.18.0"

jobs:
  check-and-build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Normalize repository owner
        id: owner
        run: |
          LOWER_OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "lower_owner=$LOWER_OWNER" >> "$GITHUB_OUTPUT"

      - name: Get latest OpenClaw release tag
        id: get_release
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          RELEASE_JSON="$(mktemp)"
          trap 'rm -f "$RELEASE_JSON"' EXIT

          curl --fail --show-error --silent --location \
            --retry 4 \
            --retry-all-errors \
            --retry-delay 2 \
            --retry-max-time 60 \
            --connect-timeout 10 \
            --max-time 30 \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            -o "$RELEASE_JSON" \
            https://api.github.com/repos/openclaw/openclaw/releases/latest

          if ! LATEST_TAG="$(jq -er '.tag_name | select(type == "string" and length > 0)' "$RELEASE_JSON")"; then
            echo "::error::OpenClaw latest release response did not contain a valid tag_name"
            exit 1
          fi

          if [[ ! "$LATEST_TAG" =~ ^v?[0-9][A-Za-z0-9._-]{0,127}$ ]]; then
            echo "::error::OpenClaw release tag failed validation"
            exit 1
          fi

          echo "tag=$LATEST_TAG" >> "$GITHUB_OUTPUT"

      - name: Check if image already exists in GHCR
        id: check_exists
        run: |
          LOWER_OWNER="${{ steps.owner.outputs.lower_owner }}"
          TARGET_TAG="${{ steps.get_release.outputs.tag }}-sandbox"
          STATUS_CODE=$(curl -s -o /dev/null -w "%{http_code}" \
            -u "${{ github.actor }}:${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.oci.image.manifest.v1+json, application/vnd.docker.distribution.manifest.v2+json" \
            "https://ghcr.io/v2/${LOWER_OWNER}/${{ env.IMAGE_REPO }}/manifests/$TARGET_TAG")
          if [ "$STATUS_CODE" -eq 200 ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          elif [ "$STATUS_CODE" -eq 404 ]; then
            echo "skip=false" >> "$GITHUB_OUTPUT"
          else
            echo "Unexpected GHCR response code: $STATUS_CODE. Continuing with build." >&2
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout release-factory repository
        if: steps.check_exists.outputs.skip == 'false'
        uses: actions/checkout@v4

      - name: Checkout OpenClaw Official Repository
        if: steps.check_exists.outputs.skip == 'false'
        uses: actions/checkout@v4
        with:
          repository: openclaw/openclaw
          ref: ${{ steps.get_release.outputs.tag }}
          path: openclaw-src

      - name: Apply OpenClaw runtime hardening
        if: steps.check_exists.outputs.skip == 'false'
        run: |
          set -euo pipefail
          PATCH_PATH="${GITHUB_WORKSPACE}/patches/openclaw-runtime-hardening.patch"
          git -C openclaw-src apply --check "$PATCH_PATH"
          git -C openclaw-src apply "$PATCH_PATH"
          git -C openclaw-src diff --check

      - name: Set up QEMU
        if: steps.check_exists.outputs.skip == 'false'
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        if: steps.check_exists.outputs.skip == 'false'
        uses: docker/setup-buildx-action@v3

      - name: Extract metadata for Docker
        if: steps.check_exists.outputs.skip == 'false'
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ steps.owner.outputs.lower_owner }}/${{ env.IMAGE_REPO }}
          tags: |
            type=raw,value=latest
            type=raw,value=${{ steps.get_release.outputs.tag }}-sandbox

      - name: Build local image
        if: steps.check_exists.outputs.skip == 'false'
        uses: docker/build-push-action@v5
        with:
          context: ./openclaw-src
          build-args: |
            OPENCLAW_INSTALL_DOCKER_CLI=1
            OPENCLAW_IMAGE_APT_PACKAGES=libgnutls30
            OPENCLAW_PREFER_PNPM=1
            OPENCLAW_NODE_BOOKWORM_IMAGE=${{ env.OPENCLAW_NODE_BOOKWORM_IMAGE }}
            OPENCLAW_NODE_BOOKWORM_SLIM_IMAGE=${{ env.OPENCLAW_NODE_BOOKWORM_SLIM_IMAGE }}
            OPENCLAW_NODE_BOOKWORM_SLIM_DIGEST=${{ env.OPENCLAW_NODE_BOOKWORM_SLIM_DIGEST }}
            OPENCLAW_NPM_VERSION=${{ env.OPENCLAW_NPM_VERSION }}
          load: true
          tags: ${{ env.TEST_IMAGE }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run Trivy vulnerability gate
        if: steps.check_exists.outputs.skip == 'false'
        env:
          TRIVY_MAX_FIXABLE_CRITICAL: "0"
          TRIVY_MAX_FIXABLE_HIGH: "40"
        run: |
          set -euo pipefail
          chmod +x scripts/trivy-image-gate.sh
          scripts/trivy-image-gate.sh \
            --image "${TEST_IMAGE}" \
            --output "${RUNNER_TEMP}/openclaw-sandbox.trivy.json" \
            --max-fixable-critical "${TRIVY_MAX_FIXABLE_CRITICAL}" \
            --max-fixable-high "${TRIVY_MAX_FIXABLE_HIGH}"

      - name: Log in to GitHub Container Registry
        if: steps.check_exists.outputs.skip == 'false'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        if: steps.check_exists.outputs.skip == 'false'
        uses: docker/build-push-action@v5
        with:
          context: ./openclaw-src
          build-args: |
            OPENCLAW_INSTALL_DOCKER_CLI=1
            OPENCLAW_IMAGE_APT_PACKAGES=libgnutls30
            OPENCLAW_PREFER_PNPM=1
            OPENCLAW_NODE_BOOKWORM_IMAGE=${{ env.OPENCLAW_NODE_BOOKWORM_IMAGE }}
            OPENCLAW_NODE_BOOKWORM_SLIM_IMAGE=${{ env.OPENCLAW_NODE_BOOKWORM_SLIM_IMAGE }}
            OPENCLAW_NODE_BOOKWORM_SLIM_DIGEST=${{ env.OPENCLAW_NODE_BOOKWORM_SLIM_DIGEST }}
            OPENCLAW_NPM_VERSION=${{ env.OPENCLAW_NPM_VERSION }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

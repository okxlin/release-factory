name: Verify and release Gemini browser

on:
  workflow_call:
    inputs:
      variant:
        required: true
        type: string
      browser_base_tag:
        default: ""
        type: string
      image_tag:
        default: ""
        type: string
      gemini_skill_ref:
        default: ""
        type: string
      push_latest:
        default: false
        type: boolean
      publish:
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@v4
      - name: Resolve immutable source, browser and Node inputs
        id: params
        env:
          VARIANT: ${{ inputs.variant }}
          BASE_TAG: ${{ inputs.browser_base_tag }}
          IMAGE_TAG: ${{ inputs.image_tag }}
          SOURCE_REF: ${{ inputs.gemini_skill_ref }}
          PUSH_LATEST: ${{ inputs.push_latest }}
          OWNER: ${{ github.repository_owner }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          case "$VARIANT" in
            kasm) builder=gemini-skill-browser-builder ;;
            linuxserver) builder=gemini-skill-browser-linuxserver-builder ;;
            *) echo 'ERROR: unsupported browser variant' >&2; exit 1 ;;
          esac
          python3 gemini-skill-browser-builder/scripts/resolve-browser-inputs.py \
            --variant "$VARIANT" --browser-base-tag "$BASE_TAG" --image-tag "$IMAGE_TAG" \
            --gemini-skill-ref "$SOURCE_REF" --push-latest "$PUSH_LATEST" \
            --output "$RUNNER_TEMP/browser-inputs.json" --github-output "$GITHUB_OUTPUT"
          owner="${OWNER,,}"
          [[ "$owner" =~ ^[a-z0-9][a-z0-9-]*$ ]]
          {
            echo "builder=$builder"
            echo "repository=ghcr.io/$owner/gemini-skill-browser"
            echo "security_refresh=$(date -u +%G-%V)"
            if [[ "$PUSH_LATEST" == true ]]; then echo "release_latest=latest-$VARIANT"; fi
          } >> "$GITHUB_OUTPUT"
      - name: Validate input and publication contracts
        run: |
          python3 gemini-skill-browser-builder/scripts/test-resolve-browser-inputs.py
          python3 scripts/test-publish-tested-image.py
          python3 scripts/test-evaluate-trivy-policy.py
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Audit the locked application dependencies
        run: npm audit --omit=dev --ignore-scripts --audit-level=high --prefix gemini-skill-browser-builder/image/runtime
      - name: Build the resolved candidate once
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./${{ steps.params.outputs.builder }}/image/Dockerfile
          platforms: linux/amd64
          load: true
          provenance: false
          tags: release-factory-test:gemini-${{ inputs.variant }}
          build-args: |
            BASE_IMAGE=${{ steps.params.outputs.base_image }}
            NODE_IMAGE=${{ steps.params.outputs.node_image }}
            GEMINI_SKILL_REF=${{ steps.params.outputs.gemini_skill_ref }}
            SECURITY_REFRESH=${{ steps.params.outputs.security_refresh }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.base.name=${{ steps.params.outputs.base_image }}
          cache-from: type=gha,scope=gemini-${{ inputs.variant }}
          cache-to: type=gha,mode=min,scope=gemini-${{ inputs.variant }}
      - name: Verify desktop, daemon, CDP, sharp and profile persistence
        env:
          IMAGE: ${{ steps.build.outputs.imageid }}
          VARIANT: ${{ inputs.variant }}
        run: python3 scripts/smoke-gemini-browser.py "$IMAGE" "$VARIANT"
      - name: Scan the tested browser and service dependencies
        env:
          IMAGE: ${{ steps.build.outputs.imageid }}
        run: |
          bash scripts/trivy-image-gate.sh --image "$IMAGE" \
            --policy gemini-skill-browser-builder/configs/trivy-policy.json --profile browser \
            --output "$RUNNER_TEMP/browser.trivy.json"
      - name: Save resolved inputs and security evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: browser-${{ inputs.variant }}-evidence-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/browser-inputs.json
            ${{ runner.temp }}/browser.trivy.json
          retention-days: 7
      - name: Log in for publication
        if: inputs.publish && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish the tested image without rebuilding
        if: inputs.publish && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          IMAGE: ${{ steps.build.outputs.imageid }}
          VARIANT: ${{ inputs.variant }}
          REPOSITORY: ${{ steps.params.outputs.repository }}
          IMAGE_TAG: ${{ steps.params.outputs.image_tag }}
          LATEST_TAG: ${{ steps.params.outputs.release_latest }}
        run: |
          python3 scripts/publish-tested-image.py stage --image "$IMAGE" --image-id "$IMAGE" \
            --variant "$VARIANT" --platform linux/amd64 --repository "$REPOSITORY" \
            --revision "$GITHUB_SHA" --run-id "$GITHUB_RUN_ID" --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --receipt "$RUNNER_TEMP/tested-image/receipt.json"
          python3 scripts/publish-tested-image.py publish --directory "$RUNNER_TEMP/tested-image" \
            --variant "$VARIANT" --repository "$REPOSITORY" --platforms linux/amd64 \
            --revision "$GITHUB_SHA" --run-id "$GITHUB_RUN_ID" --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --image-tag "$IMAGE_TAG" --latest-tag "$LATEST_TAG"

name: Build DeepSeek Harness Image

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Published image tag; leave empty to use the resolved @deepseek-ai/dsh version"
        required: false
        default: ""
      dsh_version:
        description: "DeepSeek Harness npm version or dist-tag; leave empty to resolve latest"
        required: false
        default: ""
      platforms:
        description: "Comma-separated target platforms"
        required: true
        default: "linux/amd64,linux/arm64"
      push_latest:
        description: "Also publish latest tag"
        required: true
        default: true
        type: boolean
  schedule:
    - cron: "43 3 * * 0"

concurrency:
  group: build-deepseek-harness-${{ github.ref || github.run_id }}
  cancel-in-progress: true

env:
  AUDIT_IMAGE: deepseek-harness:ci-dependency-audit
  GOVULNCHECK_VERSION: "1.7.0"
  IMAGE_REPO: deepseek-harness
  TEST_IMAGE_AMD64: deepseek-harness:ci-amd64
  TEST_IMAGE_ARM64: deepseek-harness:ci-arm64
  TRIVY_DOCKER_IMAGE: aquasec/trivy:0.74.0@sha256:62b1e65e8869bc4b4c6aa4fa2b21595256c7c2f6018a9d9ad61caf87187c1969

jobs:
  build-test-and-push:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      DOCKERHUB_NAMESPACE: ${{ vars.DOCKERHUB_USERNAME || secrets.DOCKERHUB_USERNAME }}
    permissions:
      contents: read
      packages: write

    steps:
      - name: Normalize repository owner
        id: owner
        env:
          REPOSITORY_OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          lower_owner="$(printf '%s' "${REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')"
          if [[ ! "${lower_owner}" =~ ^[a-z0-9][a-z0-9-]*$ ]]; then
            echo "ERROR: Invalid repository owner: ${REPOSITORY_OWNER}" >&2
            exit 1
          fi
          echo "lower_owner=${lower_owner}" >> "$GITHUB_OUTPUT"

      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Validate pinned component contract
        run: bash deepseek-harness-builder/scripts/check-component-pins.sh

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24.19.0"

      - name: Prepare DeepSeek Harness version
        id: dsh
        env:
          INPUT_DSH_VERSION: ${{ inputs.dsh_version }}
        run: |
          set -euo pipefail
          args=()
          if [[ -n "${INPUT_DSH_VERSION}" ]]; then
            args+=(--version "${INPUT_DSH_VERSION}")
          fi
          deepseek-harness-builder/scripts/prepare-dsh-version.sh \
            "${args[@]}" \
            --github-output "$GITHUB_OUTPUT"

      - name: Validate Docker Hub credentials
        env:
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          DOCKERHUB_USERNAME: ${{ env.DOCKERHUB_NAMESPACE }}
        run: |
          set -euo pipefail
          if [[ -z "${DOCKERHUB_USERNAME}" ]]; then
            echo "::error::DOCKERHUB_USERNAME is not configured"
            exit 1
          fi
          if [[ ! "${DOCKERHUB_USERNAME}" =~ ^[a-z0-9]+([._-][a-z0-9]+)*$ ]]; then
            echo "::error::DOCKERHUB_USERNAME is not a valid lowercase Docker Hub namespace"
            exit 1
          fi
          if [[ -z "${DOCKERHUB_TOKEN}" ]]; then
            echo "::error::DOCKERHUB_TOKEN is not configured"
            exit 1
          fi

      - name: Resolve release policy
        id: release
        env:
          EVENT_NAME: ${{ github.event_name }}
          DSH_VERSION: ${{ steps.dsh.outputs.dsh_version }}
          INPUT_IMAGE_TAG: ${{ inputs.image_tag }}
          INPUT_PUSH_LATEST: ${{ inputs.push_latest }}
        run: |
          set -euo pipefail

          if [[ "${EVENT_NAME}" == "schedule" ]]; then
            image_tag="${DSH_VERSION}"
            push_latest="true"
          else
            image_tag="${INPUT_IMAGE_TAG:-${DSH_VERSION}}"
            push_latest="${INPUT_PUSH_LATEST:-true}"
          fi

          {
            echo "dsh_version=${DSH_VERSION}"
            echo "image_tag=${image_tag}"
            echo "push_latest=${push_latest}"
          } >> "$GITHUB_OUTPUT"

      - name: Resolve build parameters
        id: params
        env:
          INPUT_PLATFORMS: ${{ inputs.platforms || 'linux/amd64,linux/arm64' }}
          RELEASE_IMAGE_TAG: ${{ steps.release.outputs.image_tag }}
          RELEASE_PUSH_LATEST: ${{ steps.release.outputs.push_latest }}
        run: |
          chmod +x deepseek-harness-builder/scripts/*.sh
          deepseek-harness-builder/scripts/resolve-build-params.sh \
            --image-repo "${IMAGE_REPO}" \
            --platforms "${INPUT_PLATFORMS}" \
            --image-tag "${RELEASE_IMAGE_TAG}" \
            --push-latest "${RELEASE_PUSH_LATEST}" \
            --latest-tag latest \
            --github-output "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.26.6"
          cache: false

      - name: Install pinned govulncheck
        run: |
          set -euo pipefail
          go install "golang.org/x/vuln/cmd/govulncheck@v${GOVULNCHECK_VERSION}"
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
          "$(go env GOPATH)/bin/govulncheck" -version

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ steps.owner.outputs.lower_owner }}/${{ steps.params.outputs.image_repo }}
          tags: ${{ steps.params.outputs.tags }}
          labels: |
            org.opencontainers.image.title=DeepSeek Harness
            org.opencontainers.image.description=Lightweight DeepSeek Harness with browser authentication, pnpm, and essential development CLI.
            org.opencontainers.image.vendor=${{ github.repository_owner }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}

      - name: Build dependency-audit stage
        uses: docker/build-push-action@v7
        with:
          context: ./deepseek-harness-builder/image
          file: ./deepseek-harness-builder/image/Dockerfile
          target: dsh-deps
          platforms: linux/amd64
          load: true
          tags: ${{ env.AUDIT_IMAGE }}
          build-args: |
            DSH_VERSION=${{ steps.release.outputs.dsh_version }}
          cache-from: type=gha,scope=deepseek-harness
          cache-to: type=gha,mode=min,scope=deepseek-harness

      - name: Audit pinned pnpm production dependencies
        run: |
          set -euo pipefail
          docker run --rm --entrypoint pnpm "${AUDIT_IMAGE}" \
            audit --prod --audit-level high

      - name: Build amd64 test image
        uses: docker/build-push-action@v7
        with:
          context: ./deepseek-harness-builder/image
          file: ./deepseek-harness-builder/image/Dockerfile
          target: runtime
          platforms: linux/amd64
          load: true
          tags: ${{ env.TEST_IMAGE_AMD64 }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            DSH_VERSION=${{ steps.release.outputs.dsh_version }}
          cache-from: type=gha,scope=deepseek-harness
          cache-to: type=gha,mode=min,scope=deepseek-harness

      - name: Run amd64 full smoke test
        run: |
          set -euo pipefail
          deepseek-harness-builder/scripts/smoke-test.sh \
            --image "${TEST_IMAGE_AMD64}" \
            --profile full \
            --variant runtime \
            --public-url https://dsh.example.test

      - name: Run amd64 external-auth passthrough smoke
        run: |
          set -euo pipefail
          deepseek-harness-builder/scripts/passthrough-smoke-test.sh \
            --image "${TEST_IMAGE_AMD64}" \
            --public-url https://dsh.example.test

      - name: Run Caddy vulnerability gate
        run: |
          set -euo pipefail
          deepseek-harness-builder/scripts/check-caddy-vulnerabilities.sh \
            --image "${TEST_IMAGE_AMD64}"

      - name: Scan amd64 runtime image
        run: |
          set -euo pipefail
          scripts/trivy-image-gate.sh \
            --image "${TEST_IMAGE_AMD64}" \
            --output "${RUNNER_TEMP}/deepseek-harness-amd64.trivy.json" \
            --max-fixable-critical 0 \
            --max-fixable-high 0

      - name: Build arm64 test image
        uses: docker/build-push-action@v7
        with:
          context: ./deepseek-harness-builder/image
          file: ./deepseek-harness-builder/image/Dockerfile
          target: runtime
          platforms: linux/arm64
          load: true
          tags: ${{ env.TEST_IMAGE_ARM64 }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            DSH_VERSION=${{ steps.release.outputs.dsh_version }}
          cache-from: type=gha,scope=deepseek-harness
          cache-to: type=gha,mode=min,scope=deepseek-harness

      - name: Run arm64 minimal smoke test under QEMU
        run: |
          set -euo pipefail
          deepseek-harness-builder/scripts/smoke-test.sh \
            --image "${TEST_IMAGE_ARM64}" \
            --profile minimal \
            --variant runtime \
            --public-url https://dsh.example.test

      - name: Scan arm64 runtime image
        run: |
          set -euo pipefail
          scripts/trivy-image-gate.sh \
            --image "${TEST_IMAGE_ARM64}" \
            --output "${RUNNER_TEMP}/deepseek-harness-arm64.trivy.json" \
            --max-fixable-critical 0 \
            --max-fixable-high 0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          registry: docker.io
          username: ${{ env.DOCKERHUB_NAMESPACE }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push multi-platform image
        uses: docker/build-push-action@v7
        with:
          context: ./deepseek-harness-builder/image
          file: ./deepseek-harness-builder/image/Dockerfile
          target: runtime
          platforms: ${{ steps.params.outputs.platforms }}
          push: true
          tags: |
            ghcr.io/${{ steps.owner.outputs.lower_owner }}/${{ steps.params.outputs.image_repo }}:${{ steps.params.outputs.image_tag }}
            docker.io/${{ env.DOCKERHUB_NAMESPACE }}/${{ steps.params.outputs.image_repo }}:${{ steps.params.outputs.image_tag }}
            ${{ steps.release.outputs.push_latest == 'true' && format('ghcr.io/{0}/{1}:{2}', steps.owner.outputs.lower_owner, steps.params.outputs.image_repo, steps.params.outputs.latest_tag) || '' }}
            ${{ steps.release.outputs.push_latest == 'true' && format('docker.io/{0}/{1}:{2}', env.DOCKERHUB_NAMESPACE, steps.params.outputs.image_repo, steps.params.outputs.latest_tag) || '' }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            DSH_VERSION=${{ steps.release.outputs.dsh_version }}
          cache-from: type=gha,scope=deepseek-harness
          cache-to: type=gha,mode=min,scope=deepseek-harness

      - name: Emit build summary
        env:
          IMAGE_NAME: ghcr.io/${{ steps.owner.outputs.lower_owner }}/${{ steps.params.outputs.image_repo }}
          IMAGE_TAG: ${{ steps.params.outputs.image_tag }}
          DSH_VERSION: ${{ steps.release.outputs.dsh_version }}
          LATEST_TAG: ${{ steps.params.outputs.latest_tag }}
          PARAM_PLATFORMS: ${{ steps.params.outputs.platforms }}
          PUSH_LATEST: ${{ steps.release.outputs.push_latest }}
        run: |
          {
            echo "## DeepSeek Harness image build"
            echo ""
            echo "- Image: ${IMAGE_NAME}"
            echo "- DeepSeek Harness: ${DSH_VERSION}"
            echo "- Published image tag: ${IMAGE_TAG}"
            echo "- Floating tag: ${LATEST_TAG} (published: ${PUSH_LATEST})"
            echo "- Registries: GitHub Container Registry and Docker Hub"
            echo "- Platforms: ${PARAM_PLATFORMS}"
            echo "- amd64: full authentication, session, WebSocket, isolation, and resource smoke"
            echo "- arm64: QEMU minimal authentication and native-module smoke"
            echo "- Security: pnpm audit, Caddy dependency-graph/govulncheck gate, and zero-fixable HIGH/CRITICAL Trivy gates"
          } >> "$GITHUB_STEP_SUMMARY"

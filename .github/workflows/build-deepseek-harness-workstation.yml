name: Build DeepSeek Harness Workstation Image

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Workstation tag or tag base; leave empty to use the resolved @deepseek-ai/dsh version"
        required: false
        default: ""
      dsh_version:
        description: "DeepSeek Harness npm version/dist-tag or dsh-v source release; leave empty to resolve the latest GitHub source release"
        required: false
        default: ""
      platforms:
        description: "Comma-separated target platforms"
        required: true
        default: "linux/amd64,linux/arm64"
      push_latest:
        description: "Also publish the workstation floating tag"
        required: true
        default: true
        type: boolean
      refresh_system_packages:
        description: "Refresh system packages while reusing source compilation caches"
        required: true
        default: true
        type: boolean
  schedule:
    - cron: "30 11 * * 5"

concurrency:
  group: build-deepseek-harness-workstation
  # Do not cancel a release while it is updating registry tags.
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/release-deepseek-harness.yml
    with:
      variant: workstation
      image_tag: ${{ inputs.image_tag || '' }}
      dsh_version: ${{ inputs.dsh_version || '' }}
      platforms: ${{ inputs.platforms || 'linux/amd64,linux/arm64' }}
      push_latest: ${{ github.event_name == 'schedule' || inputs.push_latest }}
      refresh_system_packages: ${{ github.event_name == 'schedule' || inputs.refresh_system_packages }}
    secrets:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}

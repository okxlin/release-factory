name: Validate DeepSeek Harness Component Pins

on:
  pull_request:
    paths:
      - ".github/workflows/build-deepseek-harness.yml"
      - ".github/workflows/build-deepseek-harness-workstation.yml"
      - ".github/workflows/check-deepseek-harness-component-updates.yml"
      - ".github/workflows/validate-deepseek-harness-component-pins.yml"
      - ".github/workflows/verify-deepseek-harness-pr.yml"
      - ".github/workflows/release-deepseek-harness.yml"
      - ".github/actions/verify-deepseek-harness/**"
      - "deepseek-harness-builder/**"
      - "scripts/trivy-image-gate.sh"
      - "scripts/evaluate-trivy-policy.py"
      - "scripts/test-evaluate-trivy-policy.py"
      - "SECURITY_SCAN.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Resolve locked component inputs
        id: components
        run: python3 deepseek-harness-builder/scripts/component-inputs.py --github-output "$GITHUB_OUTPUT"

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ steps.components.outputs.node_version }}

      - name: Validate pinned component contract
        run: bash deepseek-harness-builder/scripts/check-component-pins.sh

      - name: Run component-pin checker regression tests
        run: bash deepseek-harness-builder/scripts/test-component-pins.sh

      - name: Run component-update checker regression tests
        run: python3 deepseek-harness-builder/scripts/test-component-updates.py

      - name: Run image security policy regression tests
        run: python3 scripts/test-evaluate-trivy-policy.py

      - name: Run tested image publication regression tests
        run: python3 deepseek-harness-builder/scripts/test-tested-image-artifact.py

      - name: Run DeepSeek Harness version resolver regression tests
        run: |
          node --test deepseek-harness-builder/scripts/test-resolve-latest-npm-version.mjs
          node --test deepseek-harness-builder/scripts/test-resolve-dsh-source.mjs
          bash deepseek-harness-builder/scripts/test-prepare-dsh-version.sh

name: Verify DeepSeek Harness PR Build

on:
  pull_request:
    paths:
      - ".github/workflows/build-deepseek-harness.yml"
      - ".github/workflows/build-deepseek-harness-workstation.yml"
      - ".github/workflows/validate-deepseek-harness-component-pins.yml"
      - ".github/workflows/verify-deepseek-harness-pr.yml"
      - ".github/workflows/release-deepseek-harness.yml"
      - ".github/actions/verify-deepseek-harness/**"
      - "deepseek-harness-builder/**"
      - "scripts/trivy-image-gate.sh"
      - "scripts/evaluate-trivy-policy.py"
      - "scripts/test-evaluate-trivy-policy.py"
      - "SECURITY_SCAN.md"
  workflow_dispatch:

concurrency:
  group: verify-deepseek-harness-pr-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DOCKER_BUILD_RECORD_UPLOAD: "false"
  DOCKER_BUILD_SUMMARY: "false"

jobs:
  verify:
    name: Verify both variants (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
        with:
          cache-binary: false

      - name: Verify native runtime image
        uses: ./.github/actions/verify-deepseek-harness
        with:
          variant: runtime
          arch: ${{ matrix.arch }}

      - name: Verify native workstation image
        uses: ./.github/actions/verify-deepseek-harness
        with:
          variant: workstation
          arch: ${{ matrix.arch }}

; supervisor configuration for codex-claude-workstation
; runs in foreground (nodaemon) for Docker compatibility

[unix_http_server]
file=/run/codex/supervisor.sock

[supervisord]
nodaemon=true
pidfile=/run/codex/supervisord.pid

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///run/codex/supervisor.sock

[include]
files = /etc/supervisor/conf.d/*.conf

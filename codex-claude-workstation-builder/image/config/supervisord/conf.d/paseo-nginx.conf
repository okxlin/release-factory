[program:paseo-nginx]
command=/usr/sbin/nginx -c /etc/nginx/nginx.conf -g "daemon off;"
directory=/workspace
user=dev
priority=20
autostart=true
autorestart=true
startsecs=2
stopsignal=TERM
stopwaitsecs=10
stopasgroup=true
killasgroup=true
redirect_stderr=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
umask=027

[program:paseo]
command=/usr/local/bin/paseo daemon start --listen 127.0.0.1:6768 --home /home/dev/.paseo --foreground --no-relay --web-ui --hostnames paseo.internal
directory=/workspace
user=dev
priority=10
autostart=true
autorestart=true
startsecs=5
stopsignal=TERM
stopwaitsecs=20
stopasgroup=true
killasgroup=true
redirect_stderr=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
umask=027

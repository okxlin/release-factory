worker_processes 1;
pid /run/codex/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format paseo '$remote_addr - $request_method $uri $status $body_bytes_sent '
                     '"$http_user_agent"';
    access_log /dev/stdout paseo;

    sendfile on;
    keepalive_timeout 65;
    server_tokens off;

    client_body_temp_path /tmp/codex-nginx/client-body 1 2;
    proxy_temp_path /tmp/codex-nginx/proxy 1 2;

    map $http_upgrade $paseo_connection_upgrade {
        default upgrade;
        '' close;
    }

    map $http_x_forwarded_proto $paseo_forwarded_proto {
        ~*^https$ https;
        default http;
    }

    limit_req_zone $binary_remote_addr zone=paseo_api:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=paseo_web:10m rate=30r/s;
    limit_conn_zone $binary_remote_addr zone=paseo_connections:10m;
    limit_req_status 429;
    limit_conn_status 429;

    server {
        listen 6767;
        server_name _;

        client_max_body_size 100m;
        limit_conn paseo_connections 32;

        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Referrer-Policy no-referrer always;
        proxy_hide_header X-Powered-By;

        location = /api/health {
            access_log off;
            proxy_pass http://127.0.0.1:6768;
            proxy_http_version 1.1;
            proxy_set_header Host paseo.internal;
            proxy_set_header X-Forwarded-Host paseo.internal;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $paseo_forwarded_proto;
        }

        location = /ws {
            limit_req zone=paseo_api burst=10 nodelay;
            proxy_pass http://127.0.0.1:6768;
            proxy_http_version 1.1;
            proxy_buffering off;
            proxy_read_timeout 1h;
            proxy_send_timeout 1h;
            proxy_set_header Host paseo.internal;
            proxy_set_header X-Forwarded-Host paseo.internal;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $paseo_forwarded_proto;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $paseo_connection_upgrade;
            proxy_set_header Sec-WebSocket-Protocol $http_sec_websocket_protocol;

            # The public browser origin cannot match the fixed upstream Host.
            # Treat this same-container proxy as the origin boundary; Paseo still
            # authenticates the socket through its bearer WebSocket subprotocol.
            proxy_set_header Origin http://paseo.internal;
        }

        location /api/ {
            limit_req zone=paseo_api burst=40 nodelay;
            proxy_pass http://127.0.0.1:6768;
            proxy_http_version 1.1;
            proxy_buffering off;
            proxy_read_timeout 1h;
            proxy_send_timeout 1h;
            proxy_set_header Host paseo.internal;
            proxy_set_header X-Forwarded-Host paseo.internal;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $paseo_forwarded_proto;
        }

        location /mcp/ {
            limit_req zone=paseo_api burst=20 nodelay;
            proxy_pass http://127.0.0.1:6768;
            proxy_http_version 1.1;
            proxy_buffering off;
            proxy_read_timeout 1h;
            proxy_send_timeout 1h;
            proxy_set_header Host paseo.internal;
            proxy_set_header X-Forwarded-Host paseo.internal;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $paseo_forwarded_proto;
        }

        location / {
            limit_req zone=paseo_web burst=100 nodelay;
            proxy_pass http://127.0.0.1:6768;
            proxy_http_version 1.1;
            proxy_buffering off;
            proxy_read_timeout 1h;
            proxy_send_timeout 1h;
            proxy_set_header Host paseo.internal;
            proxy_set_header X-Forwarded-Host paseo.internal;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $paseo_forwarded_proto;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $paseo_connection_upgrade;
            proxy_set_header Sec-WebSocket-Protocol $http_sec_websocket_protocol;
            proxy_set_header Accept-Encoding "";

            # Paseo derives its browser connection hint from the upstream Host.
            # The upstream Host must remain fixed to block Service Proxy routes,
            # so override only the browser hint with the public page location.
            sub_filter_once on;
            sub_filter '</head>' '<script>window.__PASEO_INITIAL_DAEMON_CONNECTION__={listen:window.location.host,useTls:window.location.protocol==="https:",label:"Codex Workstation"};</script></head>';
        }
    }
}
